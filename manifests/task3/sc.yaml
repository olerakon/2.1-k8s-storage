apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual-local-storage
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-sc-local-data
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-local-storage
  hostPath:
    path: /mnt/k8s-storage/sc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-sc-local-data
spec:
  storageClassName: manual-local-storage
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
  labels:
    app: data-exchange-sc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-sc
  template:
    metadata:
      labels:
        app: data-exchange-sc
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - >
              while true; do
                echo "$(date) - message from busybox via StorageClass PVC" >> /data/shared.txt;
                sleep 5;
              done
          volumeMounts:
            - name: sc-data
              mountPath: /data
        - name: multitool
          image: wbitt/network-multitool:latest
          command: ["/bin/sh", "-c"]
          args:
            - tail -f /data/shared.txt
          volumeMounts:
            - name: sc-data
              mountPath: /data
      volumes:
        - name: sc-data
          persistentVolumeClaim:
            claimName: pvc-sc-local-data
