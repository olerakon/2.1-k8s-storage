apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-local-data
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-local
  hostPath:
    path: /mnt/k8s-storage/pv-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-local-data
spec:
  volumeName: pv-local-data
  storageClassName: manual-local
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
  labels:
    app: data-exchange-pvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-pvc
  template:
    metadata:
      labels:
        app: data-exchange-pvc
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - >
              while true; do
                echo "$(date) - message from busybox via PVC" >> /data/shared.txt;
                sleep 5;
              done
          volumeMounts:
            - name: persistent-data
              mountPath: /data
        - name: multitool
          image: wbitt/network-multitool:latest
          command: ["/bin/sh", "-c"]
          args:
            - tail -f /data/shared.txt
          volumeMounts:
            - name: persistent-data
              mountPath: /data
      volumes:
        - name: persistent-data
          persistentVolumeClaim:
            claimName: pvc-local-data
